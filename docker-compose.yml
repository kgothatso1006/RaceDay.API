version: '3.4'

services:
  raceday.api:
    image: ${DOCKER_REGISTRY-}racedayapi
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=RaceDayDB;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;

  raceday.mvc:
    image: ${DOCKER_REGISTRY-}racedaymvc
    build:
      context: .
      dockerfile: RaceDay.MVC/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiBaseUrl=http://raceday.api:8080/

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"